[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-notifier"
version = "0.2.0"
description = "Linux system tray & dashboard monitor for AI coding agent sessions, subagents, and opt-in provider quotas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
keywords = ["ai", "agent", "notifier", "tray", "waybar", "gtk4", "opencode", "antigravity", "quota"]
license = { text = "MIT" }
authors = [{ name = "agent-notifier contributors" }]
classifiers = [
  "Environment :: Console",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]

[project.scripts]
agent-notifier = "agent_notifier.cli:main"
waybar-ai-quota = "agent_notifier.cli:main"

[project.urls]
Homepage = "https://github.com/eakgn/agent-notifier"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_notifier"]

[tool.hatch.build.targets.sdist]
include = [
  "src/agent_notifier",
  "config.example.toml",
  "bin/agent-notifier",
  "install.sh",
]
