[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waybar-ai-quota"
version = "0.1.0"
description = "Waybar eklentisi ve GTK4 panel: OpenCode Go, Antigravity ve GitHub Copilot kota takibi"
requires-python = ">=3.12"
dependencies = []
keywords = ["waybar", "quota", "opencode", "antigravity", "copilot", "sway"]
license = { text = "MIT" }
authors = [{ name = "waybar-ai-quota contributors" }]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]

[project.scripts]
waybar-ai-quota = "waybar_ai_quota.cli:main"

[project.urls]
Homepage = "https://github.com/eakgn/waybar-ai-quota"

[tool.hatch.build.targets.wheel]
packages = ["src/waybar_ai_quota"]

[tool.hatch.build.targets.sdist]
include = [
  "src/waybar_ai_quota",
  "config.example.toml",
]
