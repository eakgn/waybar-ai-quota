# agent-notifier örnek yapılandırması
# Kopyalayın veya sihirbazı çalıştırın:  agent-notifier setup
# Konum: ~/.config/agent-notifier/config.toml

[harnesses]
# Yalnızca true olan harness'lar izlenir ve dashboard'da gösterilir.
opencode = true
antigravity = true

[providers]
# Yalnızca true olan kota sağlayıcıları sorgulanır ve dashboard'da gösterilir.
opencode_go = true
github_copilot = false

[refresh]
# Aktif oturum varken yerel tarama aralığı (saniye)
local_active_seconds = 3
# Boştayken yerel tarama aralığı (saniye)
local_idle_seconds = 10
# Boştayken uzak kota API önbellek ömrü (saniye)
remote_seconds = 600
# Aktif oturumun kullandığı kotayı anlık izlemek için önbellek ömrü (saniye)
remote_active_seconds = 30
opencode_go_cache_seconds = 600
copilot_cache_seconds = 600

[thresholds]
# Bu yüzdenin altı kritik kota uyarısı üretir (boştayken bar'da yalnız kritik altı görünür)
critical_pct = 15
# Yakın zamanda biten oturumların "done_unseen" sayılma süresi (saniye)
recent_activity_seconds = 300
# Ana oturum listesinde tutulan yakın çalışma penceresi (dakika)
active_window_minutes = 90
# Son 90 dakikada oturum yoksa "Son Oturumlar" için taranacak pencere (saat)
recent_history_hours = 24
# Push olaylarının bayat sayılıp zaman aşımına uğrama süresi (saniye)
event_stale_seconds = 1800

[cloud]
# Uzak API çağrıları için HTTP zaman aşımı (saniye)
timeout_seconds = 10
# OpenCode Go için resmî /zen/go/v1/usage uç noktasını dene (başarısız olursa yerel DB'ye düşer)
opencode_go_live_api = true

[copilot]
# "gh" ikili yolu (boş bırakılırsa PATH üzerinden aranır)
gh_binary = ""
plan_label_override = ""

[notifications]
enabled = true
# Aynı uyarı anahtarı için iki bildirim arasındaki en kısa süre (saniye)
cooldown_seconds = 300
# Oturum bittiğinde de masaüstü bildirimi gönder
notify_on_done = true
# Soru/izin beklerken masaüstü bildirimi gönder
notify_on_waiting = true
app_name = "agent-notifier"

[bar]
# Waybar/Polybar çıktısında model adının azami uzunluğu
max_model_chars = 20
# Boşta gösterim biçimi: "compact" veya "minimal"
idle_format = "compact"

[ui]
# GTK4/PyGObject içeren Python yorumlayıcısı (boşsa otomatik algılanır)
gtk_python = "/usr/bin/python3"
# wlroots Wayland'da layer-shell kenarı: "top-right", "top-left", "bottom-right", "bottom-left"
anchor = "top-right"
# Dashboard açıldığında "bitti (görülmedi)" durumunu otomatik okundu işaretle
ack_done_on_open = true
